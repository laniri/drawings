name: Update Production Database

on:
  workflow_dispatch:
    inputs:
      force_update:
        description: 'Force database update even if no changes detected'
        required: false
        default: 'false'
        type: boolean
  push:
    paths:
      - 'drawings.db'
    branches: [main]

env:
  AWS_REGION: eu-west-1
  ECR_REPOSITORY: children-drawing-anomaly-detection
  ECS_CLUSTER: children-drawing-prod-cluster
  ECS_SERVICE: children-drawing-prod-service

jobs:
  check-database-changes:
    name: Check Database Changes
    runs-on: ubuntu-latest
    outputs:
      database-changed: ${{ steps.check-changes.outputs.changed }}
      drawings-count: ${{ steps.db-stats.outputs.drawings }}
      analyses-count: ${{ steps.db-stats.outputs.analyses }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        lfs: true
    
    - name: Check if database changed
      id: check-changes
      run: |
        if [ "${{ github.event.inputs.force_update }}" == "true" ]; then
          echo "changed=true" >> $GITHUB_OUTPUT
          echo "Force update requested"
        elif git diff --name-only HEAD~1 HEAD | grep -q "drawings.db"; then
          echo "changed=true" >> $GITHUB_OUTPUT
          echo "Database file changed in this commit"
        else
          echo "changed=false" >> $GITHUB_OUTPUT
          echo "No database changes detected"
        fi
    
    - name: Get database statistics
      id: db-stats
      if: steps.check-changes.outputs.changed == 'true'
      run: |
        drawings=$(sqlite3 drawings.db "SELECT COUNT(*) FROM drawings;")
        analyses=$(sqlite3 drawings.db "SELECT COUNT(*) FROM anomaly_analyses;")
        echo "drawings=$drawings" >> $GITHUB_OUTPUT
        echo "analyses=$analyses" >> $GITHUB_OUTPUT
        echo "Database contains $drawings drawings and $analyses analyses"

  deploy-updated-database:
    name: Deploy Updated Database
    runs-on: ubuntu-latest
    needs: [check-database-changes]
    if: needs.check-database-changes.outputs.database-changed == 'true'
    
    permissions:
      id-token: write
      contents: read
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        lfs: true
    
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
        role-session-name: GitHubActions-DatabaseUpdate-${{ github.run_id }}
        aws-region: ${{ env.AWS_REGION }}
    
    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2
    
    - name: Build and push updated image
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: db-update-${{ github.sha }}
      run: |
        echo "Building image with updated database..."
        docker build -f Dockerfile.prod -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
        docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest
        
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
        
        echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT
    
    - name: Update ECS service
      run: |
        echo "Updating ECS service with new database..."
        aws ecs update-service \
          --cluster ${{ env.ECS_CLUSTER }} \
          --service ${{ env.ECS_SERVICE }} \
          --force-new-deployment
        
        echo "Waiting for deployment to complete..."
        aws ecs wait services-stable \
          --cluster ${{ env.ECS_CLUSTER }} \
          --services ${{ env.ECS_SERVICE }}
    
    - name: Verify database update
      run: |
        # Get the application URL and test the database
        APP_URL=$(aws cloudformation describe-stacks \
          --stack-name children-drawing-prod \
          --query 'Stacks[0].Outputs[?OutputKey==`ApplicationURL`].OutputValue' \
          --output text)
        
        echo "Testing updated database at: $APP_URL"
        
        # Wait for service to be ready
        sleep 60
        
        # Test health endpoint
        if curl -f -s "$APP_URL/health" > /dev/null; then
          echo "✅ Application health check passed"
        else
          echo "❌ Application health check failed"
          exit 1
        fi
        
        echo "✅ Database update deployment completed successfully"
        echo "   Drawings: ${{ needs.check-database-changes.outputs.drawings-count }}"
        echo "   Analyses: ${{ needs.check-database-changes.outputs.analyses-count }}"
